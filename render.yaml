# ProDG production — Loop SPA on Render (Supabase data plane)
# Coolify deferred. This is the live hosting path.

services:
  - type: web
    name: loop-web
    runtime: static
    repo: https://github.com/PRODG-XYZ/company-os
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://pkxnfkubgpbdbftvtgvf.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        value: https://company-os-cce2.onrender.com
      # Never set VITE_ALLOW_MOCK or VITE_API_URL on this service.
