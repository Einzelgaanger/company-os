services:
  postgres:
    image: postgres:16-alpine
    container_name: loop-postgres
    environment:
      POSTGRES_USER: loop_owner
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    ports:
      # 5433 avoids colliding with other local Postgres (e.g. uzima on 5432)
      - "5433:5432"
    volumes:
      - loop_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop_owner -d loop"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: loop-redis
    ports:
      # 6380 avoids colliding with other local Redis on 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  loop_pgdata:
