<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="apple-touch-icon" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1F1A" />
    <meta name="color-scheme" content="dark light" />

    <title>Loop — Makes waiting visible</title>
    <meta
      name="description"
      content="Loop makes waiting visible, and shortens it. See what is waiting, who holds it, and get it moving — without another dashboard to babysit."
    />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn, Slack, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Loop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Loop — Makes waiting visible" />
    <meta
      property="og:description"
      content="See what is waiting, who holds it, and what it costs — then get it moving. Autonomous work coordination for teams."
    />
    <!-- Primary landscape (1200×630) — used by most crawlers including WhatsApp -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Loop — Makes waiting visible, and shortens it" />
    <!-- Square tile (1200×1200) — crop-safe when chats show a centered thumbnail -->
    <meta property="og:image" content="/og-whatsapp.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Loop" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Loop — Makes waiting visible" />
    <meta
      name="twitter:description"
      content="See what is waiting, who holds it, and what it costs — then get it moving."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="Loop — Makes waiting visible, and shortens it" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
