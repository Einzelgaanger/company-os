name: ci-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rls
      - run: pnpm test:packages
      - run: pnpm eval:ai
      - run: npm run build
      - run: pnpm build:apps
      - run: pnpm typecheck:all
