# Supabase local/project config (subset relevant to Company OS).

project_id = "loop"

[functions.ingest-meeting]
verify_jwt = false          # authenticated via webhook secret / service role

[functions.telegram-webhook]
verify_jwt = false          # Telegram Bot API webhook (optional secret header)

[functions.whatsapp-webhook]
verify_jwt = false          # authenticated via X-Twilio-Signature / Meta signature

[functions.extract-commitments]
verify_jwt = true           # internal (service role)

[functions.send-checkin]
verify_jwt = true

[functions.escalate]
verify_jwt = true

[functions.generate-report]
verify_jwt = true

[functions.verify-otp]
verify_jwt = true

[functions.launch-readiness]
verify_jwt = true

[functions.oauth]
verify_jwt = false          # start/callback hit from the browser + provider redirect

[functions.invite]
verify_jwt = false          # peek/accept are public; send checks the caller's JWT itself

[functions.email-dispatch]
verify_jwt = true           # cron / service role retry sweep
